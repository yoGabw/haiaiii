<!doctype html>
<html lang="en">
<head>

  <title>Flowers For You</title>
  <link rel="stylesheet" href="styles.css" />

<body>
  <div class="sky" aria-hidden="true">
    <div class="stars" id="stars"></div>
    <div class="shooting-star"></div>
    <div class="moon"></div>
    <div class="horizon"></div>
    <div class="sea"></div>

  <main class="stage" id="stage">
    <h1 class="title">Flowers For You</h1>

    <button class="bud" id="openBtn" aria-label="Tap to open the flowers">

        <span class="flower" style="--a:24deg; --s:1;"></span>
        <span class="flower" style="--a:40deg; --s:.92;"></span>
      </span>
